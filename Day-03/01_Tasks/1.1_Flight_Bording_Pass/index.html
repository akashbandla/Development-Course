<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Boarding pass</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="1"><img src="./images/flight.logo.png" alt="flight logo" width="40px"> </th>
                <th colspan="3">Boarding pass</th>
                <th colspan="1">First Class</th>
                <th colspan="3">First Class</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="6">QR Code</td>
                <td colspan="2">Passenger Name:</td>
                <td colspan="2">From:</td>
                <td colspan="3">Passenger Name:</td>
            </tr>
            <tr>
                <td colspan="2"><strong>Bandla Akash</strong></td>
                <td colspan="2"><strong>Chennai Maa</strong></td>
                <td colspan="3"><strong>Bandla Akash</strong></td>
            </tr>

            <tr>
                <td colspan="2">Boarding Time</td>
                <td colspan="2">To:</td>
                <td colspan="1">From:</td>
                <td rowspan="2"><img src="./images/flight.logo.png" alt="flight logo" width="20px"></td>                
                <td colspan="1">To:</td>
            </tr>

            <tr>
                <td colspan="2"><strong>21:00</strong></td>
                <td colspan="2"><strong>Bangalore</strong></td>
                <td colspan="1">Chennai Maa </td>
                
                <td colspan="1">Bangalore</td>
            </tr>

            <tr>
                <td colspan="1">Gate:</td>
                <td colspan="1">Flight:</td>
                <td colspan="1">Seat:</td>
                <td colspan="1">Date:</td>
                <td colspan="1">Date:</td>
                <td rowspan="2" colspan="2">QR Code</td>
            </tr>

            <tr>
                <td colspan="1">A5</td>
                <td colspan="1">AB1234</td>
                <td colspan="1">2QB</td>
                <td colspan="1">11May</td>
                <td colspan="1">11 May</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
